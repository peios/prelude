name: Prelude checks

on:
    pull_request:
    push:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: prelude-check-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
              with:
                  persist-credentials: false
            - name: Install development tools
              run: |
                  sudo apt-get update
                  sudo apt-get install -y build-essential libclang-dev pkg-config python3-venv binutils groff
                  rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
              with:
                  node-version: "22.22.1"
            - name: Prepare PSC tools
              run: python3 tools/prepare-style-tools.py "$RUNNER_TEMP/prelude-style"
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
              with:
                  repository: peios/peios-sdk
                  ref: d56e86fbc922b83873006752600f8de7bc12cb84
                  path: .ci-sdk
                  persist-credentials: false
            - name: Prepare static development SDKs
              run: |
                  python3 tools/prepare-sdk.py .ci-sdk "$RUNNER_TEMP/sdk-gnu" --target x86_64-unknown-linux-gnu
                  python3 tools/prepare-sdk.py .ci-sdk "$RUNNER_TEMP/sdk-musl" --target x86_64-unknown-linux-musl
            - name: Check GNU build, tests and PSC
              env:
                  PEIOS_SDK: ${{ runner.temp }}/sdk-gnu
                  PEIOS_STYLE_BIN: ${{ runner.temp }}/prelude-style/bin
                  CARGO_TARGET_DIR: ${{ runner.temp }}/prelude-cargo
                  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
              run: tools/check
            - name: Check static musl build and packages
              env:
                  PEIOS_SDK: ${{ runner.temp }}/sdk-musl
              run: |
                  ./bazel test --config=musl //...
                  ./bazel build --config=musl //:packages
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
              with:
                  repository: peios/trail
                  ref: 1d662e98cbcbdd5c51c01533afcab7f5723a2eff
                  path: .ci-trail
                  persist-credentials: false
            - name: Check documentation
              run: |
                  (cd .ci-trail && tools/bazel build //:trail)
                  TRAIL="$PWD/.ci-trail/bazel-bin/trail" python3 tools/check-docs.py
