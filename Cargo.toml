[workspace]
resolver = "2"
members  = ["crates/prelude", "crates/seed-sd"]

# Shared release profile. prelude is a size-critical initramfs PID 1, so
# the settings are tuned for size over speed.
[profile.release]
opt-level     = "z"
lto           = true
codegen-units = 1
strip         = false
panic         = "abort"
