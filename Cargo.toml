[workspace]
resolver = "2"
members  = ["crates/prelude", "crates/mkirf", "crates/seed-sd"]

# Shared release profile. prelude is a size-critical initramfs PID 1;
# the aggressive settings are harmless for mkirf (a small build tool).
[profile.release]
opt-level     = "z"
lto           = true
codegen-units = 1
strip         = true
panic         = "abort"
