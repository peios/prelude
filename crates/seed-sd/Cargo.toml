[package]
name        = "seed-sd"
version     = "0.0.6"
description = "Initramfs helper: seed a default Allow-SYSTEM-GenericAll SD on a path via kacs_set_sd. Used by prelude hooks immediately after mounting a fresh tmpfs to dodge KACS DENY_MISSING."
edition     = "2021"
license     = "MIT"
publish     = false

[[bin]]
name = "seed-sd"
path = "src/main.rs"

# libp-sd provides the SD builders + the kacs_set_sd syscall wrapper.
# Use the tagged public libp-rs repo so standalone prelude checkouts build
# in the package farm without requiring a monorepo-relative sibling checkout.
[dependencies]
libp-sd = { git = "https://github.com/peios/libp-rs.git", tag = "v0.1.0", package = "libp-sd" }
