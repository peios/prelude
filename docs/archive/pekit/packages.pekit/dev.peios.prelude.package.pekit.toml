# Prelude and seed-sd are one inseparable initramfs trust domain: Prelude calls
# the helper while establishing the filesystem policy that makes later hooks
# safe, and the helper has no supported lifecycle without that caller.
[package]
name         = "dev.peios.prelude"
default_root = "initramfs"
description  = "Peios initramfs runtime, boot-hook scheduler, and SD seeding helper"
# The crate closure prelude and seed-sd link; build.main's
# collect-rust-licences --check holds this to what those crates declare.
license      = "((MIT OR Apache-2.0) AND Unicode-3.0) AND (Apache-2.0 OR MIT) AND MIT"

[provides]
init = "1"
prelude-hook-abi = "3"


[claims.provides.init.bin]
target = "/usr/sbin/prelude"
path   = "/init"

[dependencies]
sh = ">= 1"

[files]
"@source:LICENSE" = "usr/share/licenses/dev.peios.prelude/LICENSE"
":licenses/**" = "usr/share/licenses/dev.peios.prelude/third-party"
":usr/sbin/prelude" = "usr/sbin/prelude"
":usr/bin/seed-sd" = "usr/bin/seed-sd"
":usr/libexec/prelude/hook-log.sh" = "usr/libexec/prelude/hook-log.sh"
