[package]
name        = "dev.peios.prelude-debuginfo"
description = "Peios initramfs runtime debugging symbols"

[dependencies]
"dev.peios.prelude" = "= {{release}}"

[files]
"@source:LICENSE" = "usr/share/licenses/dev.peios.prelude-debuginfo/LICENSE"
":usr/share/licenses/dev.peios.prelude/Apache-2.0.txt" = "usr/share/licenses/dev.peios.prelude-debuginfo/Apache-2.0.txt"
":usr/share/licenses/dev.peios.prelude/Unicode-3.0.txt" = "usr/share/licenses/dev.peios.prelude-debuginfo/Unicode-3.0.txt"
":usr/share/licenses/dev.peios.prelude/compiler-builtins.txt" = "usr/share/licenses/dev.peios.prelude-debuginfo/compiler-builtins.txt"
":debug/usr/lib/debug/**" = "usr/lib/debug"
