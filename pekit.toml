outDir = "out"

# NixOS toolchain note: the default cargo/rustc come from a nix-shimmed
# rustc-wrapper that can't find the musl rustlib, so builds go straight
# to the rustup-managed binaries (see the old Makefile header).

[env]
TC = "$HOME/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/bin"
PATH = "$TC:$PATH"
CARGO = "$TC/cargo"
RUSTC = "$TC/rustc"

[build]
command = "cargo build --release"

[test]
command = "cargo test"

[clean]
command = "cargo clean"
