out_dir = "out"

# One immutable source artifact covers Prelude, seed-sd, the hook logging ABI,
# and the exact vendored Rust dependency closure used to build the binaries.
[source_package]
name = "dev.peios.prelude-source"

[build.main]
command = '''
set -eu

SRC=$(pwd -P)
TARGET=x86_64-unknown-linux-musl
DEBUG_ROOT="$PEKIT_OUT/usr/src/debug/dev.peios.prelude"

for tool in cargo rustc python3 cmp cp find grep ar readelf objcopy strip debugedit; do
  command -v "$tool" >/dev/null || {
    echo "prelude: missing required build tool: $tool" >&2
    exit 1
  }
done

# Cargo must build from an empty home with the committed vendor directory
# alone. This catches an incomplete Cargo.lock/vendor refresh before payload
# staging.
export CARGO_HOME="$PEKIT_OUT/cargo-home"
mkdir -p "$CARGO_HOME"
test -d "$SRC/vendor"
test -n "$(find "$SRC/vendor" -mindepth 1 -maxdepth 1 -type d -print -quit)"

# A release tag and both workspace crates describe one version.
cargo metadata --locked --offline --no-deps --format-version 1 |
  python3 -c '
import json, os, sys
metadata = json.load(sys.stdin)
members = set(metadata["workspace_members"])
versions = sorted({p["version"] for p in metadata["packages"] if p["id"] in members})
expected = os.environ["PEKIT_VERSION"]
if versions != [expected]:
    raise SystemExit(f"prelude: workspace versions {versions!r} do not equal package version {expected!r}")
'

# Preserve the static initramfs contract and keep checkout/build paths out of
# split symbols. This deliberately replaces the workspace RUSTFLAGS: ld.lld
# is invoked directly for the self-contained musl target and therefore accepts
# raw GNU-ld arguments, not the `-Wl,` driver syntax used by ordinary Peios
# Rust packages. The security policy is otherwise equivalent.
REMAP_RUSTFLAGS="--remap-path-prefix=$PEKIT_WORKSPACE_ROOT=/usr/src/debug/dev.peios.prelude/.workspace --remap-path-prefix=$PEKIT_OUT_BASE=/usr/src/debug/dev.peios.prelude/.build --remap-path-prefix=$SRC=/usr/src/debug/dev.peios.prelude"
MUSL_RUSTFLAGS="-C target-feature=+crt-static -C link-arg=-z -C link-arg=relro -C link-arg=-z -C link-arg=now -C link-arg=--build-id=sha1 $REMAP_RUSTFLAGS"
export RUSTFLAGS=$MUSL_RUSTFLAGS

# Peios ships this target as a package. Debian does not ship a precompiled
# musl std target, so its reference rung builds the exact distro rust-src with
# Cargo's build-std facility instead of downloading a rustup component.
CARGO_BUILD_STD=
target_libdir=$(rustc --print target-libdir --target "$TARGET")
if ! find "$target_libdir" -maxdepth 1 -type f -name 'libstd-*.rlib' -print -quit 2>/dev/null | grep -q .; then
  test -d "$(rustc --print sysroot)/lib/rustlib/src/rust/library"
  export RUSTC_BOOTSTRAP=1
  # Debian ships musl-gcc but not rust-lld.  Its compiler-driver interface
  # needs the equivalent linker options wrapped in -Wl, form.  Prelude's
  # release profile is panic=abort, so build std with immediate abort and no
  # backtrace paths. Debian's LLVM unwind archive is otherwise portable but
  # was compiled with two glibc fortify entry points; append tiny musl-built
  # ABI wrappers for those calls in this reference environment only.
  export CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc
  UNWIND_DIR="$PEKIT_OUT/musl-unwind"
  mkdir -p "$UNWIND_DIR"
  cp /usr/lib/llvm-19/lib/libunwind.a "$UNWIND_DIR/libunwind.a"
  musl-gcc -std=c11 -Wall -Wextra -Werror -O2 -c \
    "$SRC/packaging/debian-musl-fortify-shim.c" -o "$UNWIND_DIR/fortify-shim.o"
  ar r "$UNWIND_DIR/libunwind.a" "$UNWIND_DIR/fortify-shim.o"
  MUSL_RUSTFLAGS="-C target-feature=+crt-static -C link-self-contained=no -L native=$UNWIND_DIR -C link-arg=-Wl,-z,relro -C link-arg=-Wl,-z,now -C link-arg=-Wl,--build-id=sha1 $REMAP_RUSTFLAGS"
  export RUSTFLAGS=$MUSL_RUSTFLAGS
  CARGO_BUILD_STD='-Z build-std=std,panic_abort -Z build-std-features=panic_immediate_abort'
fi

# Run the complete test suite with the distribution's native precompiled std.
# Debian's stable Cargo build-std path cannot build a cross-target libtest for a
# panic=abort workspace without creating two incompatible core instances.  The
# shipped musl graph is exercised independently below by two clean release
# builds and by the package-level static-PIE smoke checks.
export RUSTFLAGS=$MUSL_RUSTFLAGS
for tree in build-a build-b; do
  cargo clean --target-dir "$PEKIT_OUT/$tree"
  cargo $CARGO_BUILD_STD build --release --workspace --locked --offline \
    --target "$TARGET" --target-dir "$PEKIT_OUT/$tree"
done
for bin in prelude seed-sd; do
  cmp "$PEKIT_OUT/build-a/$TARGET/release/$bin" \
      "$PEKIT_OUT/build-b/$TARGET/release/$bin"
done

mkdir -p "$PEKIT_OUT/usr/sbin" "$PEKIT_OUT/usr/bin" \
             "$PEKIT_OUT/usr/libexec/prelude" \
             "$PEKIT_OUT/usr/share/licenses/dev.peios.prelude"
cp "$PEKIT_OUT/build-a/$TARGET/release/prelude" "$PEKIT_OUT/usr/sbin/prelude"
cp "$PEKIT_OUT/build-a/$TARGET/release/seed-sd" "$PEKIT_OUT/usr/bin/seed-sd"
cp "$SRC/src/hook-log.sh" "$PEKIT_OUT/usr/libexec/prelude/hook-log.sh"
chmod 0755 "$PEKIT_OUT/usr/sbin/prelude" "$PEKIT_OUT/usr/bin/seed-sd"
chmod 0644 "$PEKIT_OUT/usr/libexec/prelude/hook-log.sh"

# Prelude itself and the ordinary OR-licensed dependencies elect MIT;
# unicode-ident additionally requires Unicode-3.0, while Rust's
# compiler-builtins carries Apache-2.0 with LLVM-exception alongside MIT.
cp "$SRC/LICENSE" "$PEKIT_OUT/usr/share/licenses/dev.peios.prelude/LICENSE"
cp "$SRC/vendor/proc-macro2-1.0.106/LICENSE-APACHE" \
   "$PEKIT_OUT/usr/share/licenses/dev.peios.prelude/Apache-2.0.txt"
cp "$SRC/vendor/unicode-ident-1.0.24/LICENSE-UNICODE" \
   "$PEKIT_OUT/usr/share/licenses/dev.peios.prelude/Unicode-3.0.txt"
cp "$SRC/vendor/compiler_builtins-0.1.140/LICENSE.txt" \
   "$PEKIT_OUT/usr/share/licenses/dev.peios.prelude/compiler-builtins.txt"

split_debug() {
  elf=$1
  debugedit -b "$SRC" -d /usr/src/debug/dev.peios.prelude -n "$elf"
  build_id=$(readelf -n "$elf" | sed -n 's/^[[:space:]]*Build ID: //p' | head -1)
  test -n "$build_id" || {
    echo "prelude: $elf has no GNU build ID" >&2
    exit 1
  }
  first=$(printf %s "$build_id" | cut -c1-2)
  rest=$(printf %s "$build_id" | cut -c3-)
  debug="$PEKIT_OUT/debug/usr/lib/debug/.build-id/$first/$rest.debug"
  mkdir -p "$(dirname "$debug")"
  objcopy --only-keep-debug "$elf" "$debug"
  strip --strip-unneeded "$elf"
  objcopy --add-gnu-debuglink="$debug" "$elf"
}

split_debug "$PEKIT_OUT/usr/sbin/prelude"
split_debug "$PEKIT_OUT/usr/bin/seed-sd"

mkdir -p "$DEBUG_ROOT"
# Cargo depfiles enumerate the exact source closure compiled into the release
# binaries. Shipping that closure avoids unrelated vendored examples/tests and
# keeps debugsource aligned with this target and feature selection.
find "$PEKIT_OUT/build-a" -type f -name '*.d' -print | LC_ALL=C sort |
while IFS= read -r origin; do
  sed -n '1p' "$origin"
done | tr ' ' '\n' | sed 's/:$//' | LC_ALL=C sort -u |
while IFS= read -r origin; do
  case "$origin" in
    *.rs) ;;
    *) continue ;;
  esac
  case "$origin" in
    "$PEKIT_OUT_BASE"/*)
      rel=.build/${origin#"$PEKIT_OUT_BASE"/}
      ;;
    "$SRC"/*)
      rel=${origin#"$SRC"/}
      ;;
    crates/*|vendor/*)
      rel=$origin
      origin="$SRC/$origin"
      ;;
    *)
      continue
      ;;
  esac
  if test -f "$origin"; then
    mkdir -p "$DEBUG_ROOT/$(dirname "$rel")"
    cp "$origin" "$DEBUG_ROOT/$rel"
  fi
done
test -n "$(find "$DEBUG_ROOT" -type f -print -quit)"

'''

[build.main.dependencies.peipkg]
"dev.peios.build-essentials" = "*"
"org.git.kernel.dash" = "*"
"org.rust-lang.rust" = ">= 1.98.1"
"org.rust-lang.rust-std-x86-64-unknown-linux-musl" = ">= 1.98.1"
"org.llvm.lld" = ">= 22, < 23"
"org.gnu.binutils" = "*"
"org.gnu.findutils" = "*"
"org.gnu.grep" = "*"
"org.sourceware.debugedit" = "*"
"org.python.python3" = "*"

[build.main.dependencies.apt]
build-essential = "*"
dash = "*"
cargo = "*"
rustc = "*"
binutils = "*"
findutils = "*"
grep = "*"
debugedit = "*"
python3 = "*"
musl-tools = "*"
rust-src = "*"
libunwind-19-dev = "*"

[test]
gate = true
needs = ["main"]
command = '''
set -eu
export CARGO_HOME="$PEKIT_OUT/cargo-home"
mkdir -p "$CARGO_HOME"
TARGET=x86_64-unknown-linux-musl
cargo clean --target-dir "$PEKIT_OUT/test-target"
cargo test --release --workspace --locked --offline \
  --target x86_64-unknown-linux-gnu --target-dir "$PEKIT_OUT/test-target"
/usr/bin/sh -n src/hook-log.sh

# Validate the exact staged package output produced by build.main.
SRC=$(pwd -P)
PEKIT_OUT="$PEKIT_MAIN_OUT"
# Fail closed on static PIE, hardening, split-debug linkage, and path leakage.
for elf in "$PEKIT_OUT/usr/sbin/prelude" "$PEKIT_OUT/usr/bin/seed-sd"; do
  readelf -h "$elf" | grep -Eq 'Type:[[:space:]]+DYN'
  readelf -lW "$elf" | grep -q 'GNU_RELRO'
  readelf -lW "$elf" | grep -Eq 'GNU_STACK[[:space:]].*RW[[:space:]]'
  ! readelf -lW "$elf" | grep -q ' INTERP '
  readelf -dW "$elf" | grep -q 'BIND_NOW'
  readelf -dW "$elf" | grep -Eq 'FLAGS_1.*PIE'
  ! readelf -dW "$elf" | grep -Eq '(NEEDED|RPATH|RUNPATH)'
  ! readelf -SW "$elf" | grep -q '\.debug_info'

  build_id=$(readelf -n "$elf" | sed -n 's/^[[:space:]]*Build ID: //p' | head -1)
  debug="$PEKIT_OUT/debug/usr/lib/debug/.build-id/$(printf %s "$build_id" | cut -c1-2)/$(printf %s "$build_id" | cut -c3-).debug"
  test -s "$debug"
  readelf -SW "$debug" | grep -q '\.debug_info'
  test "$(readelf -n "$debug" | sed -n 's/^[[:space:]]*Build ID: //p' | head -1)" = "$build_id"
  for forbidden in "$SRC" "$PEKIT_OUT_BASE" "$PEKIT_WORKSPACE_ROOT"; do
    ! grep -aF "$forbidden" "$elf" "$debug" >/dev/null
  done
done

# The shell helper is ABI payload. Pin its installed syntax and column format.
/usr/bin/sh -n "$PEKIT_OUT/usr/libexec/prelude/hook-log.sh"
actual=$(
  . "$PEKIT_OUT/usr/libexec/prelude/hook-log.sh"
  hook_log_init fixture
  HOOK_LOG_COLOUR=0
  log_ok mounted
)
test "$actual" = '[  OK  ] fixture: mounted'
'''

[test.dependencies.peipkg]
"dev.peios.build-essentials" = "*"
"org.git.kernel.dash" = "*"
"org.rust-lang.rust" = ">= 1.98.1"
"org.rust-lang.rust-std-x86-64-unknown-linux-musl" = ">= 1.98.1"
"org.llvm.lld" = ">= 22, < 23"
"org.gnu.binutils" = "*"
"org.gnu.findutils" = "*"
"org.gnu.grep" = "*"
"org.sourceware.debugedit" = "*"
"org.python.python3" = "*"

[test.dependencies.apt]
build-essential = "*"
dash = "*"
cargo = "*"
rustc = "*"
binutils = "*"
findutils = "*"
grep = "*"
debugedit = "*"
python3 = "*"
musl-tools = "*"
rust-src = "*"
libunwind-19-dev = "*"

[clean]
command = "cargo clean"
