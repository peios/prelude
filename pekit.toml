out_dir = "out"

# NixOS toolchain note: the default cargo/rustc come from a nix-shimmed
# rustc-wrapper that can't find the musl rustlib, so builds go straight
# to the rustup-managed binaries (see the old Makefile header).

[env]
TC = "$HOME/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/bin"
PATH = "$TC:$PATH"
CARGO = "$TC/cargo"
RUSTC = "$TC/rustc"

# pekit's build contract: artifacts must land in $PEKIT_OUT (the build-target
# stage), which is where the package's ':'-prefixed build-refs read from. Plain
# `cargo build` writes to ./target in the source tree, leaving the stage empty —
# so point cargo's target-dir at $PEKIT_OUT/target. (This also keeps the real
# source tree clean under --local, where the build runs in-place.)
[build]
command = 'cargo build --release --target-dir "$PEKIT_OUT/target"'

[test]
command = "cargo test"

[clean]
command = "cargo clean"
